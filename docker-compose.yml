services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    image: weather-superset:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?Set SUPERSET_ADMIN_USERNAME in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
      SUPERSET_ADMIN_FIRSTNAME: Weather
      SUPERSET_ADMIN_LASTNAME: Admin
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:?Set SUPERSET_ADMIN_EMAIL in .env}
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    command: >-
      /bin/sh -c "superset db upgrade &&
      (superset fab create-admin
      --username $$SUPERSET_ADMIN_USERNAME
      --firstname $$SUPERSET_ADMIN_FIRSTNAME
      --lastname $$SUPERSET_ADMIN_LASTNAME
      --email $$SUPERSET_ADMIN_EMAIL
      --password $$SUPERSET_ADMIN_PASSWORD || true) &&
      superset init &&
      gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120
      'superset.app:create_app()'"

volumes:
  postgres_data:
  superset_home: